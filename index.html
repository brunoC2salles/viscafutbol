<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa 3D Camp Nou</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
h1,p{margin:0}
/* Layout: estádio 3D em tela cheia à esquerda, painel de compra fixo à direita; no celular, mapa em cima e painel abaixo. Visual único escuro (pedido: fundo preto premium). */
:root{
  --bg:#07080a;
  --surface:#0e1013;
  --surface-2:#15181c;
  --line:#23262c;
  --fg:#eceae4;
  --muted:#8a8e97;
  --accent:#d4b06a;
  --cat1:#a3173f; --cat2:#7b2e6e; --cat3:#3a4fa3; --cat4:#2b78b5;
  --sold:#3a3d44; --off:#1b1d22;
  --warn:#e0a345;
  --font-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --font-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:minmax(0,1fr) 384px;height:100%}
.stage{position:relative;min-width:0;overflow:hidden;background:var(--surface)}
#gl{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}

.views{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:calc(16px + env(safe-area-inset-left,0px));display:flex;gap:6px;flex-wrap:wrap;z-index:2}
.vbtn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border:1px solid var(--line);background:rgba(14,16,19,.82);backdrop-filter:blur(8px);border-radius:999px;font-size:13px;font-weight:500;cursor:pointer;color:var(--fg)}
.vbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6}
.vbtn:hover{border-color:#3a3e46}
.vbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.vbtn:disabled{opacity:.4;cursor:not-allowed}

.legend{position:absolute;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:6px 14px;max-width:calc(100% - 32px);padding:10px 14px;background:rgba(14,16,19,.82);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:10px;font-size:12px;color:var(--muted);z-index:2}
.legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sw{width:10px;height:10px;border-radius:2px;flex:none}
.hint{position:absolute;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));font-family:var(--font-mono);font-size:11px;letter-spacing:.04em;color:var(--muted);z-index:2}

.tip{position:absolute;pointer-events:none;z-index:3;padding:9px 12px;background:#14171b;border:1px solid #2c3037;border-radius:8px;font-size:13px;line-height:1.35;transform:translate(14px,14px);white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.tip b{display:block;font-weight:600}
.tip small{color:var(--muted);font-size:12px}

.fallback{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}

/* Painel */
.panel{border-left:1px solid var(--line);background:var(--surface);overflow-y:auto;display:flex;flex-direction:column;gap:20px;padding-block:22px 28px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.match{display:flex;flex-direction:column;gap:10px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.teams{font-family:var(--font-display);font-weight:800;font-size:36px;line-height:.95;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.teams em{font-style:normal;color:var(--muted);font-weight:600;font-size:22px;display:block;margin-block:4px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.meta span{display:inline-flex;align-items:center;gap:6px}
.meta svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6}
.demo{display:inline-flex;align-self:flex-start;align-items:center;gap:6px;padding:3px 8px;border:1px dashed #4a4136;border-radius:4px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}

.sel{border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:16px;display:flex;flex-direction:column;gap:14px}
.sel.active{border-color:rgba(212,176,106,.55)}
.sel-empty{color:var(--muted);font-size:14px}
.sel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sel-name{font-family:var(--font-display);font-weight:700;font-size:24px;line-height:1;text-transform:uppercase;letter-spacing:.02em}
.sel-tier{font-size:12.5px;color:var(--muted);margin-top:4px}
.price{text-align:right;flex:none}
.price b{font-family:var(--font-display);font-weight:700;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.price small{display:block;font-size:11.5px;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.stepper button{width:38px;height:38px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center}
.stepper button:disabled{opacity:.3;cursor:not-allowed}
.stepper svg{width:14px;height:14px;stroke:currentColor;stroke-width:2;fill:none}
.stepper output{min-width:34px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.total{text-align:right}
.total small{display:block;font-size:11.5px;color:var(--muted)}
.total b{font-variant-numeric:tabular-nums;font-size:18px}
.cta{height:48px;border:0;border-radius:10px;background:var(--accent);color:#17130b;font-weight:600;font-size:15px;cursor:pointer;letter-spacing:.01em}
.cta:hover{filter:brightness(1.06)}
.cta:disabled{background:#2a2c31;color:var(--muted);cursor:not-allowed}
.fine{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.fine span{display:flex;gap:7px;align-items:center}
.fine svg{width:13px;height:13px;stroke:var(--accent);fill:none;stroke-width:2;flex:none}

.tabs{display:flex;gap:4px;padding:3px;border:1px solid var(--line);border-radius:999px;align-self:flex-start}
.tab{height:30px;padding:0 12px;border:0;border-radius:999px;background:transparent;font-size:12.5px;font-weight:500;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{background:var(--surface-2);color:var(--fg)}

.list{display:flex;flex-direction:column}
.group-title{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:14px 0 6px;display:flex;justify-content:space-between}
.item{display:grid;grid-template-columns:10px minmax(0,1fr) auto;align-items:center;gap:12px;padding:11px 10px;margin-inline:-10px;border:0;background:transparent;border-radius:8px;text-align:left;cursor:pointer;width:calc(100% + 20px)}
.item:hover{background:var(--surface-2)}
.item[aria-current="true"]{background:rgba(212,176,106,.08);box-shadow:inset 0 0 0 1px rgba(212,176,106,.35)}
.item:disabled{cursor:default;opacity:.5}
.item:disabled:hover{background:transparent}
.item .nm{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .st{font-size:12px;color:var(--muted)}
.item .st.few{color:var(--warn)}
.item .pr{font-variant-numeric:tabular-nums;font-size:14px;font-weight:600;text-align:right}
.item .pr small{display:block;font-weight:400;font-size:11px;color:var(--muted)}

.seatbar{position:absolute;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px);padding:8px 8px 8px 14px;background:rgba(14,16,19,.86);backdrop-filter:blur(8px);border:1px solid rgba(212,176,106,.45);border-radius:999px;z-index:2}
.seatbar .lbl{display:flex;flex-direction:column;min-width:0;font-size:12px;color:var(--muted);line-height:1.25}
.seatbar .lbl b{color:var(--fg);font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seatbar button{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:13px;font-weight:500;flex:none}
.ghost{height:44px;border:1px solid var(--line);border-radius:10px;background:transparent;font-weight:500;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.ghost:hover{border-color:var(--accent);color:var(--accent)}
.ghost svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#16191d;border:1px solid #2f333a;color:var(--fg);padding:12px 16px;border-radius:10px;font-size:13.5px;z-index:20;max-width:calc(100% - 32px);box-shadow:0 12px 40px rgba(0,0,0,.6)}

@media (max-width:860px){
  html,body{height:auto}
  .app{grid-template-columns:1fr;height:auto}
  .stage{height:62svh;min-height:380px}
  .panel{border-left:0;border-top:1px solid var(--line);overflow:visible}
  .hint{display:none}
  .legend{font-size:11px;padding:8px 10px;gap:4px 10px}
  .teams{font-size:32px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

</head>
<body>
<div class="app">
  <section class="stage" id="stage" aria-label="Mapa 3D del estadio">
    <canvas id="gl"></canvas>
    <div class="views" role="group" aria-label="Cámara">
      <button class="vbtn" id="vOverview" aria-pressed="true" type="button">
        <svg viewBox="0 0 24 24"><path d="M3 12c0-4 4-7 9-7s9 3 9 7-4 7-9 7-9-3-9-7z"/><path d="M7 12c0-2 2-3.5 5-3.5s5 1.5 5 3.5-2 3.5-5 3.5S7 14 7 12z"/></svg>
        Visión general
      </button>
      <button class="vbtn" id="vTop" aria-pressed="false" type="button">
        <svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="2"/><path d="M12 6v12M4 12h3M17 12h3"/></svg>
        Planta
      </button>
      <button class="vbtn" id="vSeat" aria-pressed="false" type="button" disabled>
        <svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.5"/></svg>
        Vista del sector
      </button>
    </div>
    <div class="legend" id="legend"></div>
    <div class="hint" id="hint">ARRASTRA PARA GIRAR · RUEDA PARA ZOOM</div>
    <div class="seatbar" id="seatbar" hidden><span class="lbl">Vista desde el sector<b id="seatName"></b></span><button type="button" id="seatExit">Salir</button></div>
    <div class="tip" id="tip" hidden></div>
  </section>

  <aside class="panel">
    <div class="match">
      <span class="eyebrow">LaLiga · Temporada 2026/27</span>
      <h1 class="teams">FC Barcelona<em>vs</em>Atlético de Madrid</h1>
      <div class="meta">
        <span><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Dom, 07 feb 2027 · horario por confirmar</span>
        <span><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Spotify Camp Nou</span>
      </div>
      <span class="demo">Prototipo · precios y stock ficticios</span>
    </div>

    <div class="sel" id="sel"><p class="sel-empty">Selecciona un sector en el mapa o en la lista.</p></div>

    <div class="tabs" role="tablist" aria-label="Filtrar por anillo">
      <button class="tab" role="tab" aria-selected="true" data-tier="0" type="button">Todos</button>
      <button class="tab" role="tab" aria-selected="false" data-tier="1" type="button">1.er anillo</button>
      <button class="tab" role="tab" aria-selected="false" data-tier="2" type="button">2.º anillo</button>
      <button class="tab" role="tab" aria-selected="false" data-tier="3" type="button">3.er anillo</button>
    </div>
    <div class="list" id="list"></div>
  </aside>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const reduceMotion=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
document.documentElement.lang='es';
const eur=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n);

/* ---------- Dados de exemplo ---------- */
const TIERS=[
  {id:1,name:'1.er anillo',d0:9,d1:30,h0:0.8,h1:12,f:1.0,open:true},
  {id:2,name:'2.º anillo',d0:31.5,d1:50,h0:14,h1:28,f:1.15,open:true},
  {id:3,name:'3.er anillo',d0:52.5,d1:70,h0:31,h1:47,f:0.8,open:false}
];
const SECTORS=[
  {key:'GN', name:'Gol Nord',             a0:338,a1:382,base:150},
  {key:'CNT',name:'Córner Nord · Tribuna',a0:22, a1:40, base:190},
  {key:'TN', name:'Tribuna Nord',         a0:40, a1:70, base:290},
  {key:'TC', name:'Tribuna Central',      a0:70, a1:110,base:420},
  {key:'TS', name:'Tribuna Sud',          a0:110,a1:140,base:290},
  {key:'CST',name:'Córner Sud · Tribuna', a0:140,a1:158,base:190},
  {key:'GS', name:'Gol Sud',              a0:158,a1:202,base:150},
  {key:'CSL',name:'Córner Sud · Lateral', a0:202,a1:220,base:180},
  {key:'LS', name:'Lateral Sud',          a0:220,a1:250,base:240},
  {key:'LC', name:'Lateral Central',      a0:250,a1:290,base:330},
  {key:'LN', name:'Lateral Nord',         a0:290,a1:320,base:240},
  {key:'CNL',name:'Córner Nord · Lateral',a0:320,a1:338,base:180}
];
const SOLD=new Set(['1-GS','2-TC']);
const FEW={'1-TC':4,'2-LC':6,'1-GN':3,'2-CST':5};
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const CATS=[
  {id:1,name:'Categoría 1',min:450,color:'#a3173f'},
  {id:2,name:'Categoría 2',min:320,color:'#7b2e6e'},
  {id:3,name:'Categoría 3',min:220,color:'#3a4fa3'},
  {id:4,name:'Categoría 4',min:0,  color:'#2b78b5'}
];
const catOf=p=>CATS.find(c=>p>=c.min);

const ZONES=[];
TIERS.forEach(t=>SECTORS.forEach(s=>{
  const id=t.id+'-'+s.key;
  const price=Math.round(s.base*t.f/5)*5;
  let status='ok',avail=Math.round(12+rnd()*58);
  if(!t.open){status='off';avail=0}
  else if(SOLD.has(id)){status='sold';avail=0}
  else if(FEW[id]){status='few';avail=FEW[id]}
  ZONES.push({id,tier:t,sec:s,name:s.name,price,avail,status,cat:catOf(price)});
}));

/* ---------- Estado ---------- */
let selected=null,qty=2,tierFilter=0,hovered=null;

/* ---------- Painel ---------- */
const statusText=z=>z.status==='off'?'No disponible en este partido':z.status==='sold'?'Agotado':z.status==='few'?'Últimas '+z.avail+' entradas':z.avail+' disponibles';

function renderLegend(){
  $('#legend').innerHTML=CATS.map(c=>`<span><i class="sw" style="background:${c.color}"></i>${c.name}</span>`).join('')+
    `<span><i class="sw" style="background:var(--sold)"></i>Agotado</span><span><i class="sw" style="background:var(--off);outline:1px dashed #3a3e46;outline-offset:-1px"></i>Cerrado</span>`;
}
const isAvail=z=>z.status!=='off';
document.querySelectorAll('.tab').forEach(b=>{const id=+b.dataset.tier;if(id&&!ZONES.some(z=>z.tier.id===id&&isAvail(z)))b.hidden=true});
function renderList(){
  const html=TIERS.filter(t=>!tierFilter||t.id===tierFilter).map(t=>{
    const zs=ZONES.filter(z=>z.tier===t&&isAvail(z)).sort((a,b)=>b.price-a.price);
    if(!zs.length)return '';
    const head=`<div class="group-title"><span>${t.name}</span><span>${zs.some(z=>z.status!=='sold')?'desde '+eur(Math.min(...zs.filter(z=>z.status!=='sold').map(z=>z.price))):'agotado'}</span></div>`;
    return head+zs.map(z=>{
      const dis=z.status==='off';
      const color=z.status==='sold'?'var(--sold)':dis?'var(--off)':z.cat.color;
      return `<button class="item" type="button" data-id="${z.id}" ${dis?'disabled':''} aria-current="${selected===z?'true':'false'}">
        <i class="sw" style="background:${color}"></i>
        <span style="min-width:0"><span class="nm">${z.name}</span><br><span class="st ${z.status==='few'?'few':''}">${statusText(z)}</span></span>
        <span class="pr">${z.status==='off'?'—':eur(z.price)}<small>${z.status==='off'?'':'por entrada'}</small></span>
      </button>`}).join('');
  }).join('');
  $('#list').innerHTML=html;
}
function renderSel(){
  const el=$('#sel');
  if(!selected){el.classList.remove('active');el.innerHTML='<p class="sel-empty">Selecciona un sector en el mapa o en la lista.</p>';return}
  const z=selected,sold=z.status==='sold';
  qty=Math.max(1,Math.min(qty,z.avail||1));
  el.classList.add('active');
  el.innerHTML=`
    <div class="sel-head">
      <div><div class="sel-name">${z.name}</div><div class="sel-tier">${z.tier.name} · ${z.cat.name}</div></div>
      <div class="price"><b>${eur(z.price)}</b><small>por entrada</small></div>
    </div>
    <div class="row">
      <div class="stepper" aria-label="Cantidad">
        <button type="button" id="qMinus" aria-label="Una menos" ${sold||qty<=1?'disabled':''}><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
        <output id="qOut" aria-live="polite">${sold?0:qty}</output>
        <button type="button" id="qPlus" aria-label="Una más" ${sold||qty>=z.avail?'disabled':''}><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
      <div class="total"><small>${sold?'Agotado':statusText(z)}</small><b>${sold?'—':eur(z.price*qty)}</b></div>
    </div>
    <button class="ghost" id="seeView" type="button"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.5"/></svg>Ver vista desde este sector</button>
    <button class="cta" id="cta" type="button" ${sold?'disabled':''}>${sold?'Agotado':'Continuar al carrito'}</button>
    <div class="fine">
      <span><svg viewBox="0 0 24 24"><path d="M5 12l4 4 10-10"/></svg>Asientos juntos garantizados</span>
      <span><svg viewBox="0 0 24 24"><path d="M5 12l4 4 10-10"/></svg>Reserva de 15 min al entrar en el carrito</span>
      <span><svg viewBox="0 0 24 24"><path d="M5 12l4 4 10-10"/></svg>Entradas nominativas enviadas por email</span>
    </div>`;
  $('#qMinus').onclick=()=>{qty--;renderSel()};
  $('#qPlus').onclick=()=>{qty++;renderSel()};
  $('#cta').onclick=()=>toast('Prototipo: el carrito y el pago aún no están conectados.');
  $('#seeView').onclick=()=>{if(window.enterSeat)window.enterSeat(z);if(window.innerWidth<=860)$('#stage').scrollIntoView({behavior:reduceMotion?'auto':'smooth',block:'start'})};
}
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2800)}

$('#list').addEventListener('click',e=>{const b=e.target.closest('.item');if(!b||b.disabled)return;select(ZONES.find(z=>z.id===b.dataset.id),true)});
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
  tierFilter=+b.dataset.tier;document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===b));renderList();
}));

renderLegend();renderList();renderSel();

/* ---------- 3D ---------- */
if(!window.THREE||!THREE.OrbitControls){
  $('#stage').insertAdjacentHTML('beforeend','<div class="fallback">No se pudo cargar el motor 3D. La lista sigue funcionando.</div>');return;
}

const meshes=[];const groups={};
function buildZone(z){
  const t=z.tier,s=z.sec,pad=.9,off=z.status==='off';
  const a0=s.a0+pad,a1=s.a1-pad,span=a1-a0,steps=Math.max(8,Math.round(span/1.5));
  const R=Math.max(8,Math.round((t.d1-t.d0)/1.5)),lip=1.4,base=t.h0-lip;
  const pos=[],col=[];
  const v=(deg,d,y)=>{const p=P(deg,d);return [p[0],y,p[1]]};
  const q=(A,B,C,D,sh)=>{pos.push(...A,...B,...C,...A,...C,...D);for(let k=0;k<6;k++)col.push(sh,sh,sh)};
  const dAt=r=>t.d0+(t.d1-t.d0)*r/R,yAt=r=>t.h0+(t.h1-t.h0)*r/R;
  for(let i=0;i<steps;i++){
    const ta=a0+span*i/steps,tb=a0+span*(i+1)/steps;
    for(let r=0;r<R;r++){
      const da=dAt(r),db=dAt(r+1),y0=yAt(r),y1=yAt(r+1);
      q(v(ta,da,y0),v(tb,da,y0),v(tb,da,y1),v(ta,da,y1),.42);
      q(v(ta,da,y1),v(tb,da,y1),v(tb,db,y1),v(ta,db,y1),1);
      if(i===0)q(v(ta,da,base),v(ta,da,y1),v(ta,db,y1),v(ta,db,base),.3);
      if(i===steps-1)q(v(tb,da,base),v(tb,da,y1),v(tb,db,y1),v(tb,db,base),.3);
    }
    q(v(ta,t.d0,base),v(tb,t.d0,base),v(tb,t.d0,t.h0),v(ta,t.d0,t.h0),.28);
    q(v(ta,t.d1,t.h1),v(tb,t.d1,t.h1),v(tb,t.d1,base),v(ta,t.d1,base),.28);
    q(v(ta,t.d0,base),v(tb,t.d0,base),v(tb,t.d1,base),v(ta,t.d1,base),.22);
  }
  const g=geo(pos,col);
  const baseHex=z.status==='sold'?'#3a3d44':off?'#2a2d33':z.cat.color;
  const mat=new THREE.MeshStandardMaterial({color:lin(baseHex),vertexColors:true,roughness:.78,metalness:.03,side:THREE.DoubleSide,
    transparent:off,opacity:off?.32:1,depthWrite:!off,emissive:new THREE.Color(0)});
  const mesh=new THREE.Mesh(g,mat);mesh.userData.zone=z;mesh.castShadow=!off;mesh.receiveShadow=!off;
  const grp=new THREE.Group();grp.add(mesh);
  /* contorno usado na seleção */
  const ol=[];for(let i=0;i<=steps;i++){const p=v(a0+span*i/steps,t.d0,t.h0+.08);ol.push(new THREE.Vector3(...p))}
  for(let i=steps;i>=0;i--){const p=v(a0+span*i/steps,t.d1,t.h1+.08);ol.push(new THREE.Vector3(...p))}
  const outline=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(ol),new THREE.LineBasicMaterial({color:lin('#f3dfae'),transparent:true,opacity:0,toneMapped:false}));
  grp.add(outline);
  /* vomitórios (bocas de acesso) */
  if(!off){const n=span>34?2:1;
    for(let k=1;k<=n;k++){const a=a0+span*k/(n+1),r=Math.round(R*.42),p=v(a,dAt(r),yAt(r));
      const vm=new THREE.Mesh(new THREE.BoxGeometry(3.2,2.4,4.2),new THREE.MeshBasicMaterial({color:lin('#050607')}));
      vm.position.set(p[0],p[1]+.9,p[2]);vm.lookAt(0,p[1]+.9,0);grp.add(vm)}}
  const mid=(a0+a1)/2,cm=P(mid,(t.d0+t.d1)/2);
  grp.userData={zone:z,mesh,outline,base:baseHex,center:new THREE.Vector3(cm[0],(t.h0+t.h1)/2,cm[1]),mid,lift:0};
  scene.add(grp);groups[z.id]=grp;if(!off)meshes.push(mesh);
}

}

  if(fly){const k=Math.min(1,(now-fly.start)/fly.ms),e=ease(k);flying=true;
    camera.position.lerpVectors(fly.p0,fly.p1,e);controls.target.lerpVectors(fly.t0,fly.t1,e);camera.lookAt(controls.target);if(k>=1)fly=null;}
  Object.values(groups).forEach(g=>{const l=g.userData.lift;g.position.y+=(l-g.position.y)*(reduceMotion?1:.15)});
  if(!flying)controls.update();renderer.render(scene,camera);requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
})();
</script>
